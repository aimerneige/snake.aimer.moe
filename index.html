<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Snake</title>
    <meta name="description" content="A smooth, minimal Snake game in your browser." />
    <meta name="theme-color" content="#f3f5ef" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script>
      // Apply the saved / system theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem('snake.theme');
          if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-DpSCLLbr.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BjMZqvKS.css">
  </head>
  <body>
    <div id="app" class="app"></div>
    <noscript><p style="padding:24px;font-family:sans-serif">This game needs JavaScript. · 这个游戏需要 JavaScript。 · JavaScript を有効にしてください。</p></noscript>
  </body>
</html>
